<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>aidev dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #0f1117; --card: #171a23; --border: #262b38; --text: #e6e9f0;
    --muted: #8a90a3; --accent: #5b8dff; --green: #34d399; --amber: #fbbf24;
    --red: #f87171; --purple: #c084fc;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:13px; }
  header { padding:12px 20px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between; gap:16px; position:sticky; top:0; background:var(--bg); z-index:10; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  header .meta { color:var(--muted); font-size:12px; white-space:nowrap; }
  #searchBox { background:#171a23; border:1px solid var(--border); color:var(--text); border-radius:6px; padding:6px 10px; font-size:12.5px; flex:1; min-width:180px; max-width:320px; }
  #toast { position:fixed; bottom:16px; right:16px; max-width:420px; z-index:100; }
  .toast-item { background:var(--card); border:1px solid var(--border); border-left:3px solid var(--accent); padding:10px 14px; border-radius:6px; margin-top:8px; font-size:12.5px; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  .toast-item.err { border-left-color:var(--red); }
  main { padding:16px 20px 60px; }
  .board { display:grid; grid-template-columns: repeat(3, 1fr); gap:16px; align-items:start; }
  .col h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; font-weight:600; display:flex; justify-content:space-between; }
  .col-count { color:var(--text); background:var(--card); border:1px solid var(--border); border-radius:9px; padding:0 7px; font-size:11px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:8px; padding:11px 13px; margin-bottom:9px; }
  .card.needs-you { border-color:var(--red); box-shadow:0 0 0 1px rgba(248,113,113,.25); }
  .card.running { border-color:var(--green); }
  .status-strip { display:flex; align-items:center; gap:6px; font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.03em; margin-bottom:6px; }
  .status-strip.needs-you { color:var(--red); }
  .status-strip.running { color:var(--green); }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot.pulse { animation:pulse 1.4s ease-in-out infinite; }
  .dot.running { background:var(--green); }
  .dot.needs-you { background:var(--red); }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.35; } }
  .key-row { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .key { font-weight:600; font-size:13px; }
  .pr-num { color:var(--muted); font-size:12px; }
  a { color:var(--accent); text-decoration:none; }
  a:hover { text-decoration:underline; }
  .repo { color:var(--muted); font-size:11.5px; margin-top:1px; }
  .summary { color:var(--text); margin-top:4px; font-size:12.5px; line-height:1.35; }
  .badges { margin-top:7px; display:flex; gap:5px; flex-wrap:wrap; }
  .badge { font-size:10.5px; padding:1px 7px; border-radius:9px; border:1px solid var(--border); color:var(--muted); white-space:nowrap; }
  .badge.status { color:var(--text); font-weight:500; }
  .badge.red { color:var(--red); border-color:var(--red); }
  .badge.green { color:var(--green); border-color:var(--green); }
  .badge.amber { color:var(--amber); border-color:var(--amber); }
  .badge.purple { color:var(--purple); border-color:var(--purple); }
  .blockers { margin-top:6px; font-size:11.5px; }
  .blocker-chip { display:inline-block; padding:1px 7px; border-radius:9px; font-size:10px; margin-right:4px; margin-top:2px; border:1px solid; }
  .blocker-chip.hard { color:var(--red); border-color:var(--red); }
  .blocker-chip.soft { color:var(--amber); border-color:var(--amber); }
  .links { margin-top:7px; font-size:11.5px; color:var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .stuck-note { margin-top:7px; padding:7px 9px; background:#241a1a; border:1px solid #4a2a2a; border-radius:6px; font-size:11.5px; color:#e8b4b4; max-height:100px; overflow-y:auto; }
  .actions { display:flex; gap:5px; flex-wrap:wrap; margin-top:9px; }
  button { background:#20242f; color:var(--text); border:1px solid var(--border); border-radius:5px; padding:4px 9px; font-size:11px; cursor:pointer; white-space:nowrap; }
  button:hover { background:#2a2f3d; border-color:#3a4256; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  button:disabled:hover { background:#20242f; border-color:var(--border); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { background:#4a7bf0; }
  button.danger { background:#3a1f22; border-color:var(--red); color:var(--red); }
  button.danger:hover { background:#4a2529; }
  button.warn { background:#3a2f16; border-color:var(--amber); color:var(--amber); }
  button.warn:hover { background:#463a1c; }
  .empty { color:var(--muted); font-size:12px; padding:14px 0; }
  dialog { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:16px; width:420px; max-width:90vw; }
  dialog::backdrop { background:rgba(0,0,0,.5); }
  dialog h3 { margin:0 0 10px; font-size:13px; }
  dialog textarea { width:100%; min-height:80px; background:#0f1117; color:var(--text); border:1px solid var(--border); border-radius:5px; padding:8px; font-family:inherit; font-size:12.5px; resize:vertical; }
  dialog .dialog-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
  @media (max-width: 900px) { .board { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>aidev dashboard</h1>
  <input id="searchBox" type="text" placeholder="Search tickets…">
  <div class="meta" id="meta">loading…</div>
</header>
<main id="main"><div class="empty">Loading…</div></main>
<div id="toast"></div>

<dialog id="reworkDialog">
  <h3 id="reworkTitle">Send to rework</h3>
  <textarea id="reworkNote" placeholder="Note for the rework (posted on the PR / Jira)..."></textarea>
  <div class="dialog-actions">
    <button id="reworkCancel">Cancel</button>
    <button class="primary" id="reworkConfirm">Send</button>
  </div>
</dialog>

<script src="/app.js"></script>
</body>
</html>
